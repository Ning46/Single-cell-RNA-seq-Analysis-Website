<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>login</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <!-- 外层容器距离顶部留白改小，并让高度略有余量 -->
  <div class="d-flex align-items-start justify-content-center"
       style="height: calc(100vh - 3rem); padding-top: 1.5rem;">
    <!-- 卡片宽度改大，最大 500px，最小 350px -->
    <div class="card p-4 shadow-sm"
         style="min-width:350px; max-width:500px; width:100%;">
      <h3 class="text-center mb-4">Welcome to Scrna Exploration</h3>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger text-center">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.login') }}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username"
                 name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password"
                 name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <p class="text-center mt-3 mb-0">
        No account? <a href="{{ url_for('auth.register') }}">Register (^v^)</a>
      </p>
    </div>
  </div>
</body>
</html>
