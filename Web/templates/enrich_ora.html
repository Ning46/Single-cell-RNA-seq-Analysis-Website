{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">ORA Enrichment Analysis</h2>
  <form method="post"
        enctype="multipart/form-data"
        action="{{ url_for('enrich.enrich_index', method='ora') }}"
        class="row g-3 align-items-end">
    <div class="col-md-4">
      <label for="library" class="form-label">Gene Set Library</label>
      <select id="library" name="library" class="form-select">
        {% for lib in libs %}
          <option value="{{ lib }}"
            {% if lib==selected_library %}selected{% endif %}>
            {{ lib }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label for="organism" class="form-label">Organism</label>
      <select id="organism" name="organism" class="form-select">
        <option value="Human" {% if selected_organism=='Human' %}selected{% endif %}>Human</option>
        <option value="Mouse" {% if selected_organism=='Mouse' %}selected{% endif %}>Mouse</option>
      </select>
    </div>
    <!-- 文件上传部分 -->
    <div class="col-md-5">
      <label class="form-label">Gene List (.txt)</label>
      <input type="file" id="gene_file" name="gene_file"
             accept=".txt" class="d-none" required>
      <div class="input-group">
        <input type="text" id="file-name" class="form-control"
               placeholder="No file chosen" readonly>
        <button type="button" id="btn-file"
                class="btn btn-outline-secondary">
          Choose File
        </button>
      </div>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Run ORA</button>
    </div>
  </form>

  {% if enrich_done %}
  <hr class="my-4">
  <div class="row gx-4 gy-4">
  <div class="col-12">
    <h5>Barplot</h5>
    <div class="card p-2">
      <img src="{{ url_for('static', filename=bar_plot) }}"
           class="img-fluid w-100" style="max-height:600px;" alt="Barplot">
    </div>
  </div>
  <div class="col-12">
    <h5>Dotplot</h5>
    <div class="card p-2">
      <img src="{{ url_for('static', filename=dot_plot) }}"
           class="img-fluid w-100" style="max-height:600px;" alt="Dotplot">
    </div>
  </div>
</div>
  {% endif %}
</div>

<script>
// 点击自定义按钮，触发文件选择
document.getElementById('btn-file').addEventListener('click', function(){
  document.getElementById('gene_file').click();
});
// 选中文件后，把文件名写到文本框
document.getElementById('gene_file').addEventListener('change', function(){
  document.getElementById('file-name').value =
    this.files.length ? this.files[0].name : 'No file chosen';
});
</script>

{% endblock %}
