<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <!-- 顶部留白小一些，并向顶部对齐 -->
  <div class="d-flex align-items-start justify-content-center"
       style="height: calc(100vh - 3rem); padding-top: 1.5rem;">
    <!-- 拉宽卡片，最大 500px，最小 350px -->
    <div class="card p-4 shadow-sm"
         style="min-width:350px; max-width:500px; width:100%;">
      <h3 class="text-center mb-4">Welcome to Scrna Exploration</h3>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger text-center">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.register') }}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Your Username</label>
          <input type="text" class="form-control" id="username"
                 name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Your Password</label>
          <input type="password" class="form-control" id="password"
                 name="password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Had an account? (⊙o⊙)？
        <a href="{{ url_for('auth.login') }}">Login</a>
      </p>
    </div>
  </div>
</body>
</html>
